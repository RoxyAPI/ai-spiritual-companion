name: Spec drift

# Weekly check that every endpoint this template calls still exists in the live OpenAPI
# specification. It reads a public specification and needs no secrets. A failure here means the
# template needs updating, not that a contributor broke something, which is why it is not part of
# the pull request checks: a green build must never depend on a third party being reachable.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:drift
